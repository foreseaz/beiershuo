    <title>贝儿说 · 次要人生主题星图</title>
    <!--
      The opening screen, here so it shows before any script arrives (src/boot.ts lets it go). The seven topics as
      points, in their nebulae's colours and places on the map, the heart in the middle: each lights in turn as a thread
      reaches it from the heart. When the map is ready the points swell and fade while the nebulae spread from the
      heart to their places.
    -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; justify-items: center; gap: 30px;
        padding-bottom: 7vh; pointer-events: none;
        background:
          radial-gradient(ellipse 60% 22% at 78% 78%, rgba(74, 90, 166, 0.28), transparent 70%),
          radial-gradient(ellipse 70% 60% at 50% 45%, #161b42 0%, transparent 70%),
          linear-gradient(180deg, #0a0d26 0%, #121739 55%, #151b41 100%);
      }
      .boot-mark { width: 150px; height: 150px; overflow: visible; }
      .boot-mark * { transform-box: fill-box; transform-origin: center; }
      .boot-orbit { fill: none; stroke: rgba(241, 227, 200, 0.2); stroke-width: 0.45; stroke-dasharray: 0.5 3; transform-box: view-box; animation: boot-turn 80s linear infinite; }
      .boot-spoke { stroke: rgba(196, 206, 255, 0.75); stroke-width: 0.55; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: boot-reach 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.36s); }
      .boot-star { fill: var(--c); opacity: 0.32; animation: boot-breathe 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.36s); }
      .boot-star .halo { opacity: 0.75; }
      .boot-star .core { fill: #fff7ea; }
      .boot-text {
        margin: 0; padding-left: 0.62em; font: 400 13px/1 'Beier Serif', 'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
        letter-spacing: 0.62em; color: transparent;
        background: linear-gradient(90deg, rgba(217, 205, 184, 0.42) 30%, rgba(252, 246, 234, 0.95) 50%, rgba(217, 205, 184, 0.42) 70%) 0 0 / 300% 100%;
        -webkit-background-clip: text; background-clip: text; animation: boot-sheen 3.6s linear infinite;
      }
      @keyframes boot-turn { to { transform: rotate(360deg); } }
      @keyframes boot-breathe { 0%, 100% { opacity: 0.32; transform: scale(0.78); } 30% { opacity: 1; transform: scale(1.15); } 60% { opacity: 0.6; transform: scale(0.95); } }
      @keyframes boot-reach { 0% { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 0.7; } 30% { stroke-dashoffset: 0; opacity: 0.55; } 70%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes boot-sheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
      /* The map is ready: the points swell into the nebulae spreading behind them, and the words go first. */
      html[data-boot='unfolding'] .boot-mark { transform: scale(2.8); opacity: 0; transition: transform 1.4s cubic-bezier(0.16, 0.84, 0.3, 1), opacity 1.1s ease 0.1s; }
      html[data-boot='unfolding'] .boot-text { opacity: 0; transform: translateY(8px); transition: opacity 0.45s ease, transform 0.45s ease; }
      /* The data didn't come: everything stops, and the words say why. */
      html[data-boot='failed'] #boot * { animation: none; }
      html[data-boot='failed'] .boot-star { opacity: 0.3; }
      html[data-boot='failed'] .boot-text { color: #d9cdb8; background: none; letter-spacing: 0.2em; padding-left: 0.2em; }
      @media (max-width: 680px) {
        #boot { gap: 26px; }
        .boot-mark { width: 128px; height: 128px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation: none !important; }
        .boot-star { opacity: 0.85; }
        .boot-spoke { opacity: 0.3; stroke-dashoffset: 0; }
        .boot-text { color: #d9cdb8; background: none; }
        html[data-boot='unfolding'] .boot-mark { transform: none; transition: opacity 0.6s ease; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <svg class="boot-mark" viewBox="-64 -64 128 128" aria-hidden="true">
        <defs><filter id="boot-blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.2" /></filter></defs>
        <circle class="boot-orbit" r="40" />
        <g>
          <line class="boot-spoke" style="--i: 1" x2="-20" y2="-34.6" pathLength="1" />
          <line class="boot-spoke" style="--i: 2" x2="20" y2="-34.6" pathLength="1" />
          <line class="boot-spoke" style="--i: 3" x2="40" y2="0" pathLength="1" />
          <line class="boot-spoke" style="--i: 4" x2="20" y2="34.6" pathLength="1" />
          <line class="boot-spoke" style="--i: 5" x2="-20" y2="34.6" pathLength="1" />
          <line class="boot-spoke" style="--i: 6" x2="-40" y2="0" pathLength="1" />
        </g>
        <!-- 情绪与身体 at the heart; then 自我信任, 意义与方向, 生活节奏, 自我价值, 关系边界, 亲密与连接 round the ring. -->
        <g class="boot-star" style="--i: 0; --c: #f9c6a2"><circle class="halo" r="8" filter="url(#boot-blur)" /><circle class="core" r="2.3" /></g>
        <g class="boot-star" style="--i: 1; --c: #f6e2a2"><circle class="halo" cx="-20" cy="-34.6" r="6" filter="url(#boot-blur)" /><circle class="core" cx="-20" cy="-34.6" r="1.6" /></g>
        <g class="boot-star" style="--i: 2; --c: #b2e3ef"><circle class="halo" cx="20" cy="-34.6" r="6" filter="url(#boot-blur)" /><circle class="core" cx="20" cy="-34.6" r="1.6" /></g>
        <g class="boot-star" style="--i: 3; --c: #bfe9cf"><circle class="halo" cx="40" cy="0" r="6" filter="url(#boot-blur)" /><circle class="core" cx="40" cy="0" r="1.6" /></g>
        <g class="boot-star" style="--i: 4; --c: #dcc6f2"><circle class="halo" cx="20" cy="34.6" r="6" filter="url(#boot-blur)" /><circle class="core" cx="20" cy="34.6" r="1.6" /></g>
        <g class="boot-star" style="--i: 5; --c: #a7baff"><circle class="halo" cx="-20" cy="34.6" r="6" filter="url(#boot-blur)" /><circle class="core" cx="-20" cy="34.6" r="1.6" /></g>
        <g class="boot-star" style="--i: 6; --c: #f6bfcb"><circle class="halo" cx="-40" cy="0" r="6" filter="url(#boot-blur)" /><circle class="core" cx="-40" cy="0" r="1.6" /></g>
      </svg>
      <p class="boot-text">正在展开星图</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_AUTH: ${{ secrets.WRANGLER_AUTH }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -n "$WRANGLER_AUTH" ]; then
            auth_dir="${XDG_CONFIG_HOME:-$HOME/.config}/.wrangler/config"
            mkdir -p "$auth_dir"
            printf '%s\n' "$WRANGLER_AUTH" > "$auth_dir/default.toml"
            chmod 600 "$auth_dir/default.toml"
          fi
          npm run deploy
